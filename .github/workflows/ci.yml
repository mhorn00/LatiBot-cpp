name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (Windows, MSVC, ${{ matrix.configuration }})
    runs-on: windows-latest

    # Release as well as Debug, since NDEBUG changes what is built: the
    # default log level, and anything under #ifdef NDEBUG. ASan, clang-tidy
    # and fuzzing stay local (docs/testing/README.md, Tooling).
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Debug
            test_preset: debug
          - configuration: Release
            test_preset: release

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Cheap and independent of the build: catches a test added without
      # regenerating docs/testing/Test_Catalog.md, and any mistagged test,
      # since the generator refuses those.
      - name: Check the test catalog is up to date
        if: matrix.configuration == 'Debug'
        run: |
          pwsh -NoProfile -File tools/Update-TestCatalog.ps1
          git diff --exit-code -- docs/testing/Test_Catalog.md

      # Also cheap and independent of the build. It uses Visual Studio's
      # clang-format, as the local task does; if the image's version ever
      # formats differently, this is where it shows.
      - name: Check formatting
        if: matrix.configuration == 'Debug'
        run: pwsh -NoProfile -File tools/Invoke-ClangFormat.ps1 -Check

      - name: Install Conan
        run: pip install "conan>=2.0"

      # Detection follows whatever the image ships. Its result is printed
      # because the toolset it picks decides whether ConanCenter has prebuilt
      # binaries: a new MSVC means every dependency is built from source.
      - name: Detect Conan profile
        run: |
          conan profile detect --force
          conan profile show -s compiler.cppstd=20

      # Cache the built dependency packages (OpenSSL, zlib, opus, SQLite,
      # CTRE, Catch2). DPP itself is built from source by our CMake and is not
      # cached; that is the slowest part of a cold run.
      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ matrix.configuration }}-${{ hashFiles('conanfile.py') }}
          restore-keys: conan-${{ runner.os }}-${{ matrix.configuration }}-

      - name: Install dependencies
        run: conan install . --build=missing -s build_type=${{ matrix.configuration }} -s compiler.cppstd=20

      # The msvc preset expects the multi-config layout Conan produces for a
      # Visual Studio generator. If that ever changes, say so plainly instead
      # of letting CMake fail with a missing toolchain file.
      - name: Check the dependency layout
        run: |
          if (-not (Test-Path build/generators/conan_toolchain.cmake)) {
            Get-ChildItem -Recurse -Depth 2 build | Select-Object -ExpandProperty FullName
            Write-Error "Expected build/generators/conan_toolchain.cmake (multi-config layout)"
            exit 1
          }

      # The msvc preset does not name a Visual Studio version: the runner
      # image switched from VS 2022 to VS 2026, which is what broke the first
      # run. Local builds use this same preset.
      - name: Configure
        run: cmake --preset msvc

      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }}

      - name: Test
        run: ctest --preset ${{ matrix.test_preset }}

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          version=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install gitleaks /usr/local/bin/

      - name: Scan repository
        run: gitleaks detect --source . --redact --verbose
